<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .card-soft { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
    .btn-accent { background: #1a6b4a; color: #fff; border: none; }
    .btn-accent:hover { background: #14553a; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card-soft p-4 p-md-5">
          <h1 class="h3 fw-bold mb-3">Contact Us</h1>
          <p class="text-secondary mb-4">Send a message and we’ll get back to you shortly.</p>
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input class="form-control" type="text" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input class="form-control" type="text" />
            </div>
            <div class="col-12">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" />
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5"></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-accent" type="button">Send Message</button>
            </div>
          </form>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card-soft p-4 h-100">
          <h2 class="h5 fw-bold mb-3">Support Details</h2>
          <p class="mb-2"><strong>Email:</strong> support@smartbooking.com</p>
          <p class="mb-2"><strong>Phone:</strong> +20 XXX XXX XXXX</p>
          <p class="mb-0"><strong>Hours:</strong> Sun - Thu, 9:00 AM - 6:00 PM</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
