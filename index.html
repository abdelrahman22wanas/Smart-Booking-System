<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Redirecting</title>
  <script>
    // Check if user is logged in by looking for auth tokens or session
    const isLoggedIn = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || localStorage.getItem('userSession');
    
    if (isLoggedIn) {
      // User is logged in, go to home page
      window.location.replace('smartbooking.html');
    } else {
      // User is not logged in, go to welcome page
      window.location.replace('welcome.html');
    }
  </script>
</head>
<body>
  <p>Redirecting... If you are not redirected automatically, <a href="welcome.html">click here</a>.</p>
</body>
</html>
