<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="admin-root" class="panel p-4 p-md-5"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { createElement: h } = React;

    function StatCard({ title, value, tone }) {
      return h('div', { className: 'col-md-4' },
        h('div', { className: 'p-3 rounded border ' + tone },
          h('div', { className: 'text-secondary small' }, title),
          h('div', { className: 'h4 fw-bold mb-0' }, value)
        )
      );
    }

    function App() {
      const todays = [
        { user: 'Ava', service: 'Consultation', time: '10:00 AM' },
        { user: 'Noah', service: 'Support', time: '11:30 AM' },
        { user: 'Mia', service: 'Follow-up', time: '03:00 PM' }
      ];

      return h('div', null,
        h('h1', { className: 'h3 fw-bold mb-3' }, 'Admin Dashboard'),
        h('p', { className: 'text-secondary mb-4' }, 'Built with React.js + Bootstrap 5'),
        h('div', { className: 'row g-3 mb-4' },
          h(StatCard, { title: 'Total Bookings', value: '128', tone: 'bg-light' }),
          h(StatCard, { title: 'Today Appointments', value: '24', tone: 'bg-light' }),
          h(StatCard, { title: 'Pending Requests', value: '7', tone: 'bg-light' })
        ),
        h('h2', { className: 'h5 fw-bold mb-3' }, 'Today Schedule'),
        h('ul', { className: 'list-group' },
          todays.map((item, idx) =>
            h('li', { key: idx, className: 'list-group-item d-flex justify-content-between align-items-center' },
              h('span', null, item.user + ' — ' + item.service),
              h('span', { className: 'badge text-bg-secondary' }, item.time)
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('admin-root')).render(h(App));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
