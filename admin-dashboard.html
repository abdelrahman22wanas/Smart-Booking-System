<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="admin-root" class="panel p-4 p-md-5"></div>
  </main>

  <script>
    const todays = [
      { user: 'Ava', service: 'Consultation', time: '10:00 AM' },
      { user: 'Noah', service: 'Support', time: '11:30 AM' },
      { user: 'Mia', service: 'Follow-up', time: '03:00 PM' }
    ];

    const stats = [
      { title: 'Total Bookings', value: '128' },
      { title: 'Today Appointments', value: '24' },
      { title: 'Pending Requests', value: '7' }
    ];

    const statsHtml = stats.map((item) => `
      <div class="col-md-4">
        <div class="p-3 rounded border bg-light">
          <div class="text-secondary small">${item.title}</div>
          <div class="h4 fw-bold mb-0">${item.value}</div>
        </div>
      </div>
    `).join('');

    const scheduleHtml = todays.map((item) => `
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>${item.user} - ${item.service}</span>
        <span class="badge text-bg-secondary">${item.time}</span>
      </li>
    `).join('');

    document.getElementById('admin-root').innerHTML = `
      <h1 class="h3 fw-bold mb-3">Admin Dashboard</h1>
      <p class="text-secondary mb-4">Built with basic JavaScript + Bootstrap 5</p>
      <div class="row g-3 mb-4">${statsHtml}</div>
      <h2 class="h5 fw-bold mb-3">Today Schedule</h2>
      <ul class="list-group">${scheduleHtml}</ul>
    `;
  </script>
  <script src="assets/js/script.js"></script>
</body>
</html>
