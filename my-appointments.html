<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — My Appointments</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="appointments-root" class="panel p-4 p-md-5"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { createElement: h } = React;

    function App() {
      const appointments = [
        { id: 'A-1001', service: 'General Consultation', date: '2026-03-22', time: '10:00 AM', status: 'Confirmed' },
        { id: 'A-1002', service: 'Follow-up Visit', date: '2026-03-24', time: '11:30 AM', status: 'Pending' },
        { id: 'A-1003', service: 'Technical Support', date: '2026-03-29', time: '03:00 PM', status: 'Confirmed' }
      ];

      return h('div', null,
        h('h1', { className: 'h3 fw-bold mb-3' }, 'My Appointments (User Dashboard)'),
        h('p', { className: 'text-secondary mb-4' }, 'Built with React.js + Bootstrap 5'),
        h('div', { className: 'table-responsive' },
          h('table', { className: 'table align-middle' },
            h('thead', null,
              h('tr', null,
                h('th', null, 'ID'),
                h('th', null, 'Service'),
                h('th', null, 'Date'),
                h('th', null, 'Time'),
                h('th', null, 'Status')
              )
            ),
            h('tbody', null,
              appointments.map((item) => h('tr', { key: item.id },
                h('td', null, item.id),
                h('td', null, item.service),
                h('td', null, item.date),
                h('td', null, item.time),
                h('td', null,
                  h('span', { className: item.status === 'Confirmed' ? 'badge text-bg-success' : 'badge text-bg-warning' }, item.status)
                )
              ))
            )
          )
        ),
        h('a', { className: 'btn btn-outline-secondary mt-2', href: 'book-appointment.html' }, 'Book New Appointment')
      );
    }

    ReactDOM.createRoot(document.getElementById('appointments-root')).render(h(App));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
