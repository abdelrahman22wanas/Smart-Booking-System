<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — My Appointments</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="appointments-root" class="panel p-4 p-md-5"></div>
  </main>

  <script>
    const appointments = [
      { id: 'A-1001', service: 'General Consultation', date: '2026-03-22', time: '10:00 AM', status: 'Confirmed' },
      { id: 'A-1002', service: 'Follow-up Visit', date: '2026-03-24', time: '11:30 AM', status: 'Pending' },
      { id: 'A-1003', service: 'Technical Support', date: '2026-03-29', time: '03:00 PM', status: 'Confirmed' }
    ];

    const rowsHtml = appointments.map((item) => {
      const badgeClass = item.status === 'Confirmed' ? 'badge text-bg-success' : 'badge text-bg-warning';
      return `
        <tr>
          <td>${item.id}</td>
          <td>${item.service}</td>
          <td>${item.date}</td>
          <td>${item.time}</td>
          <td><span class="${badgeClass}">${item.status}</span></td>
        </tr>
      `;
    }).join('');

    document.getElementById('appointments-root').innerHTML = `
      <h1 class="h3 fw-bold mb-3">My Appointments (User Dashboard)</h1>
      <p class="text-secondary mb-4">Built with basic JavaScript + Bootstrap 5</p>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Service</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <a class="btn btn-outline-secondary mt-2" href="book-appointment.html">Book New Appointment</a>
    `;
  </script>
  <script src="assets/js/script.js"></script>
</body>
</html>
