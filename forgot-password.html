<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
    .btn-accent { background: #1a6b4a; color: #fff; border: none; }
    .btn-accent:hover { background: #14553a; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Back to Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="panel p-4 p-md-5 mx-auto" style="max-width: 560px;">
      <h1 class="h3 fw-bold mb-3">Forgot Password</h1>
      <p class="text-secondary mb-4">Enter your account email and we’ll send a password reset link.</p>
      <form id="reset-form" class="row g-3">
        <div class="col-12">
          <label class="form-label">Email Address</label>
          <input id="reset-email" class="form-control" type="email" placeholder="you@example.com" required />
        </div>
        <div class="col-12 d-flex gap-2 flex-wrap">
          <button class="btn btn-accent" type="submit">Send Reset Link</button>
          <a class="btn btn-outline-secondary" href="login.html">Cancel</a>
        </div>
      </form>
      <div id="reset-message" class="alert alert-success mt-4 d-none" role="alert"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');
    const emailInput = document.getElementById('reset-email');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;
      message.textContent = `If an account exists for ${email}, a reset link has been sent.`;
      message.classList.remove('d-none');
      form.reset();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
