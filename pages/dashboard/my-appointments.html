<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareFlow — My Appointments</title>
  <!-- Google Fonts for typography -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Utility stylesheet for layout and table styles -->
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--accent); text-decoration: none; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
  </style>
</head>
<body>
  <!-- PAGE: My Appointments Dashboard (pages/dashboard/my-appointments.html)
       User dashboard showing only the logged-in user's booked appointments.
       Displays: ID, Service, Date, Time, Status, and Cancel button.
       Allows users to cancel pending/confirmed appointments. -->
  
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="../../smartbooking.html">CareFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="../../smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../appointments/book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="../auth/login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="appointments-root" class="panel p-4 p-md-5"></div>
  </main>

  <script src="../../assets/js/script.js"></script>
  <script>
    // Update navbar based on login status
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = localStorage.getItem('sb_current_user');
      const loginLink = document.querySelector('a[href*="login.html"].btn');
      const registerLink = document.querySelector('a[href*="register.html"]');
      
      if (currentUser && loginLink) {
        loginLink.style.display = 'none';
        if (registerLink) registerLink.style.display = 'none';
        
        // Create profile link
        const profileLi = document.createElement('li');
        profileLi.className = 'nav-item';
        const profileLink = document.createElement('a');
        profileLink.href = 'profile.html';
        profileLink.className = 'btn btn-dark btn-sm ms-lg-2';
        profileLink.textContent = 'Profile';
        profileLi.appendChild(profileLink);
        loginLink.parentElement.parentElement.insertBefore(profileLi, loginLink.parentElement);
        
        // Create logout button
        const logoutLi = document.createElement('li');
        logoutLi.className = 'nav-item';
        const logoutBtn = document.createElement('button');
        logoutBtn.textContent = 'Logout';
        logoutBtn.style.cssText = 'background: #dc2626; color: white; border: none; padding: 0.375rem 0.75rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; margin-left: 0.5rem; transition: background 0.2s;';
        logoutBtn.addEventListener('mouseenter', () => logoutBtn.style.background = '#991b1b');
        logoutBtn.addEventListener('mouseleave', () => logoutBtn.style.background = '#dc2626');
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('sb_current_user');
          window.location.href = '../../smartbooking.html';
        });
        logoutLi.appendChild(logoutBtn);
        loginLink.parentElement.parentElement.insertBefore(logoutLi, loginLink.parentElement);
      }
    });
  </script>
</body>
</html>
