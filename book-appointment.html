<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBooking — Book Appointment</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f5f3ee; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: #1a6b4a; text-decoration: none; }
    .form-card { background: #fff; border: 1px solid #e0ddd6; border-radius: 18px; }
    .btn-accent { background: #1a6b4a; color: #fff; border: none; }
    .btn-accent:hover { background: #14553a; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="brand" href="smartbooking.html">SmartBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
          <li class="nav-item"><a class="btn btn-dark btn-sm ms-lg-2" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="form-card p-4 p-md-5 mx-auto" style="max-width: 900px;">
      <h1 class="h2 fw-bold mb-4">Book Appointment</h1>
      <form id="bookingForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="bookingName">Full Name</label>
          <input id="bookingName" class="form-control" type="text" placeholder="Enter your name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="bookingEmail">Email</label>
          <input id="bookingEmail" class="form-control" type="email" placeholder="you@example.com" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="bookingService">Service</label>
          <select id="bookingService" class="form-select" required>
            <option value="" selected disabled>Choose a service</option>
            <option>General Consultation</option>
            <option>Follow-up Visit</option>
            <option>Technical Support</option>
            <option>Advisory Session</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="bookingDate">Date</label>
          <input id="bookingDate" class="form-control" type="date" required />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="bookingTime">Time</label>
          <select id="bookingTime" class="form-select" required>
            <option value="" selected disabled>Choose time</option>
            <option>10:00 AM</option>
            <option>11:00 AM</option>
            <option>01:00 PM</option>
            <option>03:00 PM</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="bookingNotes">Notes</label>
          <textarea id="bookingNotes" class="form-control" rows="4" placeholder="Add any additional details..."></textarea>
        </div>
        <div class="col-12 d-flex gap-2 flex-wrap">
          <button class="btn btn-accent px-4" type="submit">Confirm Booking</button>
          <a class="btn btn-outline-secondary" href="my-appointments.html">Go to My Appointments</a>
        </div>
        <div class="col-12">
          <p id="bookingMessage" class="small"></p>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
