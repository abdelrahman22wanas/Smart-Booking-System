<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareFlow — My Profile</title>
  <!-- Google Fonts for typography -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Utility stylesheet for layout and form styles -->
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <script>
    // Apply saved theme immediately to prevent flash
    const savedTheme = localStorage.getItem('sb_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #edfdf9;
      --surface: #ffffff;
      --ink: #102a2a;
      --ink-muted: #55706d;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --accent-light: #ccfbf1;
      --secondary: #14b8a6;
      --accent2: #f59e0b;
      --border: #cde8e1;
      --radius: 14px;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --shadow-accent: rgba(15,118,110,.25);
      --shadow-elevated: rgba(0,0,0,.14);
      --input-bg: #ffffff;
      --input-focus: rgba(15,118,110,.14);
      --input-hover-bg: #f8fffd;
      --surface-soft: #f8fafc;
    }

    html[data-theme="dark"] {
      --bg: #071a19;
      --surface: #0d2422;
      --surface-soft: #12312e;
      --ink: #ecfdf9;
      --ink-muted: #9fc9c3;
      --accent: #2dd4bf;
      --accent-dark: #14b8a6;
      --accent-light: #134e4a;
      --secondary: #5eead4;
      --accent2: #fbbf24;
      --border: #1f4b46;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #f87171;
      --shadow-accent: rgba(45,212,191,.22);
      --shadow-elevated: rgba(0,0,0,.32);
      --input-bg: #12312e;
      --input-focus: rgba(45,212,191,.18);
      --input-hover-bg: #173b37;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--accent); text-decoration: none; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
    
    /* Profile-specific styles */
    .profile-header {
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      color: white;
      padding: 3rem 2rem;
      border-radius: 18px;
      margin-bottom: 2rem;
      text-align: center;
    }

    .profile-header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
    }

    .profile-header p {
      margin: 0.5rem 0 0 0;
      opacity: 0.95;
    }

    .profile-section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--ink);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--ink);
      font-size: 0.95rem;
    }

    .form-input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--input-focus);
    }

    .form-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px var(--shadow-accent);
    }

    .btn-secondary {
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .alert-error {
      background: rgba(220, 38, 38, 0.1);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .alert-info {
      background: rgba(15, 118, 110, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .edit-mode .form-input {
      cursor: text;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .danger-zone {
      background: rgba(220, 38, 38, 0.05);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .danger-zone .section-title {
      color: var(--danger);
      border-color: var(--danger);
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .profile-header {
        padding: 2rem 1rem;
      }

      .profile-header h1 {
        font-size: 1.5rem;
      }
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--ink-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logout-btn {
      margin-top: 2rem;
    }

    .password-field-group {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 2.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 1.2rem;
      padding: 0.25rem 0.5rem;
    }

    .toggle-password:hover {
      color: var(--accent);
    }

    .navbar {
      background-color: var(--surface) !important;
      border-bottom-color: var(--border) !important;
    }

    .navbar .nav-link {
      color: var(--ink) !important;
    }

    .navbar .nav-link:hover {
      color: var(--accent) !important;
    }

    .navbar .nav-link.active {
      color: var(--accent) !important;
      font-weight: 600;
    }

    .theme-toggle {
      position: relative !important;
      background: var(--surface) !important;
      color: var(--ink) !important;
      border: 1px solid var(--border) !important;
      width: 40px !important;
      height: 40px !important;
      border-radius: 50% !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 1.2rem !important;
      transition: all 0.2s ease !important;
      padding: 0 !important;
      font-weight: normal !important;
    }

    .theme-toggle:hover {
      background: var(--accent-light) !important;
      color: var(--accent) !important;
      border-color: var(--accent) !important;
    }

    .theme-toggle:focus {
      outline: none !important;
      box-shadow: 0 0 0 3px var(--input-focus) !important;
    }
  </style>
</head>
<body>
  <!-- PAGE: Profile (pages/dashboard/profile.html)
       User profile management page after login.
       Displays user information with edit capabilities.
       Allows password change and account deletion. -->
  
  <nav class="navbar navbar-expand-lg border-bottom" style="background: var(--surface);">
    <div class="container py-2">
      <a class="brand" href="../../smartbooking.html">CareFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="../../smartbooking.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../appointments/book-appointment.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
          <li class="nav-item"><button class="theme-toggle" id="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" onclick="toggleTheme()">☾</button></li>
          <li class="nav-item"><button class="btn btn-danger btn-sm ms-lg-2" id="logout-btn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="profile-root"></div>
  </main>

  <script src="../../assets/js/script.js"></script>
  <script>
    const API_BASE = window.location.origin;

    // Initialize theme immediately
    const html = document.documentElement;
    const currentTheme = localStorage.getItem('sb_theme') || 'light';
    html.setAttribute('data-theme', currentTheme);

    // Theme toggle function
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('sb_theme', next);
      console.log('Theme switched to:', next);
    }

    // Ensure toggleTheme is globally accessible
    window.toggleTheme = toggleTheme;

    async function initProfilePage() {
      try {
        const root = document.getElementById('profile-root');
        const currentUser = JSON.parse(localStorage.getItem('sb_current_user'));

        if (!currentUser) {
          window.location.href = '../auth/login.html';
          return;
        }

        const response = await fetch(`${API_BASE}/api/user?email=${encodeURIComponent(currentUser.email)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to load profile');
        }

        renderProfile(root, data.user);
        setupLogoutButton();
      } catch (error) {
        const root = document.getElementById('profile-root');
        root.innerHTML = `<div class="panel p-4"><div class="alert alert-error">${error.message}</div></div>`;
      }
    }

    function renderProfile(root, user) {
      const profileHTML = `
        <div class="profile-header">
          <h1>${user.firstName} ${user.lastName}</h1>
          <p>${user.email}</p>
        </div>

        <div class="panel p-4 p-md-5">
          <!-- Success/Error Messages -->
          <div id="alerts-container"></div>

          <!-- Personal Information Section -->
          <div class="profile-section">
            <h2 class="section-title">Personal Information</h2>
            
            <form id="personal-form">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="first-name">First Name</label>
                  <input 
                    type="text" 
                    id="first-name" 
                    class="form-input" 
                    value="${user.firstName}" 
                    disabled 
                    required
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="last-name">Last Name</label>
                  <input 
                    type="text" 
                    id="last-name" 
                    class="form-input" 
                    value="${user.lastName}" 
                    disabled 
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input 
                  type="email" 
                  id="email" 
                  class="form-input" 
                  value="${user.email}" 
                  disabled 
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input 
                  type="tel" 
                  id="phone" 
                  class="form-input" 
                  value="${user.phone}" 
                  disabled 
                  required
                />
              </div>

              <div class="btn-group">
                <button type="button" id="edit-btn" class="btn btn-primary">Edit Profile</button>
                <button type="submit" id="save-btn" class="btn btn-primary" style="display: none;">Save Changes</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
              </div>
            </form>
          </div>

          <div class="divider"></div>

          <!-- Security Section -->
          <div class="profile-section">
            <h2 class="section-title">Security</h2>
            
            <form id="password-form">
              <div class="form-group password-field-group">
                <label class="form-label" for="current-password">Current Password</label>
                <input 
                  type="password" 
                  id="current-password" 
                  class="form-input" 
                  required
                />
                <button type="button" class="toggle-password" onclick="togglePassword('current-password')">👁</button>
              </div>

              <div class="form-group password-field-group">
                <label class="form-label" for="new-password">New Password</label>
                <input 
                  type="password" 
                  id="new-password" 
                  class="form-input" 
                  required
                />
                <button type="button" class="toggle-password" onclick="togglePassword('new-password')">👁</button>
              </div>

              <div class="form-group password-field-group">
                <label class="form-label" for="confirm-password">Confirm New Password</label>
                <input 
                  type="password" 
                  id="confirm-password" 
                  class="form-input" 
                  required
                />
                <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">👁</button>
              </div>

              <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
          </div>

          <div class="divider"></div>

          <!-- Danger Zone -->
          <div class="danger-zone">
            <h3 class="section-title">Danger Zone</h3>
            <p style="margin-bottom: 1rem; color: var(--ink-muted);">
              Delete your account permanently. This action cannot be undone and will remove all your data.
            </p>
            <button type="button" id="delete-btn" class="btn btn-danger">Delete Account</button>
          </div>
        </div>
      `;

      root.innerHTML = profileHTML;
      setupProfileHandlers(user);
    }

    function setupProfileHandlers(user) {
      const editBtn = document.getElementById('edit-btn');
      const saveBtn = document.getElementById('save-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const personalForm = document.getElementById('personal-form');
      const passwordForm = document.getElementById('password-form');
      const deleteBtn = document.getElementById('delete-btn');

      const firstNameInput = document.getElementById('first-name');
      const lastNameInput = document.getElementById('last-name');
      const phoneInput = document.getElementById('phone');

      // Edit mode toggle
      editBtn.addEventListener('click', () => {
        firstNameInput.disabled = false;
        lastNameInput.disabled = false;
        phoneInput.disabled = false;
        editBtn.style.display = 'none';
        saveBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'inline-block';
      });

      cancelBtn.addEventListener('click', () => {
        firstNameInput.value = user.firstName;
        lastNameInput.value = user.lastName;
        phoneInput.value = user.phone;
        firstNameInput.disabled = true;
        lastNameInput.disabled = true;
        phoneInput.disabled = true;
        editBtn.style.display = 'inline-block';
        saveBtn.style.display = 'none';
        cancelBtn.style.display = 'none';
      });

      // Save profile changes
      personalForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!firstName || !lastName || !phone) {
          showAlert('Please fill in all fields', 'error');
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
          const response = await fetch(`${API_BASE}/api/user`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: user.email,
              firstName,
              lastName,
              phone
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Failed to update profile');
          }

          user.firstName = firstName;
          user.lastName = lastName;
          user.phone = phone;

          showAlert('Profile updated successfully', 'success');
          firstNameInput.disabled = true;
          lastNameInput.disabled = true;
          phoneInput.disabled = true;
          editBtn.style.display = 'inline-block';
          saveBtn.style.display = 'none';
          cancelBtn.style.display = 'none';
        } catch (error) {
          showAlert(error.message, 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
        }
      });

      // Change password
      passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
          showAlert('Please fill in all password fields', 'error');
          return;
        }

        if (newPassword.length < 8) {
          showAlert('New password must be at least 8 characters', 'error');
          return;
        }

        if (newPassword !== confirmPassword) {
          showAlert('Passwords do not match', 'error');
          return;
        }

        const submitBtn = passwordForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Changing...';

        try {
          const response = await fetch(`${API_BASE}/api/user/change-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: user.email,
              currentPassword,
              newPassword
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Failed to change password');
          }

          showAlert('Password changed successfully', 'success');
          passwordForm.reset();
        } catch (error) {
          showAlert(error.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Change Password';
        }
      });

      // Delete account
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
          return;
        }

        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Deleting...';

        try {
          const response = await fetch(`${API_BASE}/api/user`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: user.email })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Failed to delete account');
          }

          localStorage.removeItem(CURRENT_USER_KEY);
          showAlert('Account deleted successfully. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '../auth/login.html';
          }, 2000);
        } catch (error) {
          showAlert(error.message, 'error');
          deleteBtn.disabled = false;
          deleteBtn.textContent = 'Delete Account';
        }
      });
    }

    function showAlert(message, type) {
      const container = document.getElementById('alerts-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);

      if (type === 'success') {
        setTimeout(() => alert.remove(), 5000);
      }
    }

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function setupLogoutButton() {
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('sb_current_user');
          window.location.href = '../auth/login.html';
        });
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      initProfilePage();
      setupLogoutButton();
      
      // Setup theme toggle button
      const themeBtn = document.getElementById('theme-toggle-btn');
      if (themeBtn) {
        themeBtn.addEventListener('click', toggleTheme);
      }
    });
  </script>
</body>
</html>
